# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch (master/main)
  push:
    branches: ['master'] # Adjust if your default branch is 'main'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment. A new push cancels whatever's queued or in
# progress ahead of it — for a single-maintainer static site, the latest push should
# always be what goes live, not whichever push got there first.
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    # Safety net for a runner-side hang (e.g. a build step that never returns) once
    # this job is actually executing. This does NOT cover a run stuck pending the
    # github-pages environment gate before execution starts — that was the actual
    # failure mode on 2026-09-14, and is handled separately by deploy-watchdog.yml.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: website/package-lock.json # Point to the correct lock file location
      - name: Install dependencies
        run: npm install
        working-directory: ./website # Run npm install in the website directory
      - name: Build
        run: npm run build
        working-directory: ./website # Run npm build in the website directory
      - name: Create .nojekyll file
        run: touch ./website/dist/.nojekyll # Add .nojekyll file to disable Jekyll
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: './website/dist' # Point to the correct build output directory
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4